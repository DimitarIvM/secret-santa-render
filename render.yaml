databases:
  - name: santa-db
    plan: free
    databaseName: santa

services:
  - type: web
    name: secret-santa
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: santa-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
